spring:
  application:
    name: workgraph
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/workgraph}
    username: ${DATABASE_USERNAME:workgraph}
    password: ${DATABASE_PASSWORD:workgraph}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 300000

server:
  port: 8080

jira:
  base-url: ${JIRA_BASE_URL:}
  email: ${JIRA_EMAIL:}
  token: ${JIRA_TOKEN:}

github:
  token: ${GITHUB_TOKEN:}
